# 별도 이미지 빌드 없이 테스트용 HTTP 서버 코드를 Pod에 주입합니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-session-test
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import parse_qs, urlparse

    # Istio가 선택한 Pod를 응답에 표시해 동일 쿠키의 라우팅 결과를 비교합니다.
    POD_NAME = os.environ["POD_NAME"]
    # 큰 응답 시험을 재현 가능한 세 가지 크기로 제한합니다.
    ALLOWED_SIZE_KIB = {8, 16, 32}


    class Handler(BaseHTTPRequestHandler):
        def send_json(self, status, payload, large_header_bytes=0):
            # 모든 JSON 응답에 Pod 이름을 넣고 필요할 때 큰 헤더를 추가합니다.
            body = json.dumps(payload, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Workshop-Pod", POD_NAME)
            if large_header_bytes:
                self.send_header("X-Workshop-Large-Header", "x" * large_header_bytes)
            self.end_headers()
            self.wfile.write(body)

        def send_bytes(self, status, body):
            # 큰 본문 시험은 실제 byte 길이를 Content-Length와 함께 반환합니다.
            self.send_response(status)
            self.send_header("Content-Type", "application/octet-stream")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("X-Workshop-Pod", POD_NAME)
            self.end_headers()
            self.wfile.write(body)

        def parse_size_kib(self, request):
            values = parse_qs(request.query).get("size", [])
            try:
                size_kib = int(values[0])
            except (IndexError, ValueError):
                self.send_json(400, {"error": "size must be 8, 16, or 32"})
                return None
            if size_kib not in ALLOWED_SIZE_KIB:
                self.send_json(400, {"error": "size must be 8, 16, or 32"})
                return None
            return size_kib

        def do_POST(self):
            request = urlparse(self.path)
            if request.path != "/upload":
                self.send_json(404, {"error": "not found"})
                return
            # 요청 본문을 저장하지 않고 선언된 길이만큼 읽어 실제 수신 byte 수를 확인합니다.
            try:
                content_length = int(self.headers.get("Content-Length", ""))
            except ValueError:
                self.send_json(400, {"error": "valid Content-Length required"})
                return
            if content_length < 0:
                self.send_json(400, {"error": "valid Content-Length required"})
                return
            body = self.rfile.read(content_length)
            if len(body) != content_length:
                self.send_json(400, {"error": "incomplete request body"})
                return
            # Gateway를 통과해 Pod가 받은 정확한 byte 수와 처리 Pod만 JSON으로 반환합니다.
            self.send_json(
                200,
                {"pod": POD_NAME, "received_bytes": len(body)},
            )

        def do_GET(self):
            request = urlparse(self.path)
            # /healthz는 Probe에, /identity는 cookie affinity 확인에 사용합니다.
            if request.path == "/healthz":
                self.send_json(200, {"status": "ok", "pod": POD_NAME})
                return
            if request.path == "/identity":
                self.send_json(200, {"pod": POD_NAME})
                return
            # /headers와 /body는 NGINX buffer annotation 없이 큰 응답을 시험합니다.
            if request.path == "/headers":
                size_kib = self.parse_size_kib(request)
                if size_kib is None:
                    return
                self.send_json(
                    200,
                    {"pod": POD_NAME, "header_kib": size_kib},
                    large_header_bytes=size_kib * 1024,
                )
                return
            if request.path == "/body":
                size_kib = self.parse_size_kib(request)
                if size_kib is None:
                    return
                self.send_bytes(200, b"x" * (size_kib * 1024))
                return
            self.send_json(404, {"error": "not found"})

        def log_message(self, format, *args):
            print(f"{self.client_address[0]} {format % args}", flush=True)


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
# 두 Pod를 배포해 동일 쿠키의 고정과 Pod 삭제 후 재매핑을 관찰합니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-session-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: istio-session-test
  template:
    metadata:
      labels:
        app: istio-session-test
    spec:
      # Pod와 볼륨 파일을 non-root 사용자로 실행합니다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: app
        # 범용 Python 이미지가 ConfigMap의 코드를 실행하므로 이미지 빌드가 필요 없습니다.
        image: python:3.12-alpine
        command: ["python", "/app/server.py"]
        env:
        - name: POD_NAME
          # Downward API로 실제 Pod 이름을 응답에 포함합니다.
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: http
          containerPort: 8080
        # 준비된 Pod만 Service 엔드포인트에 포함합니다.
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 3
        # 테스트 서버가 응답하지 않으면 컨테이너를 다시 시작합니다.
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        # 워크샵 노드에서 두 Pod를 가볍게 실행하도록 자원을 제한합니다.
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        # 애플리케이션 컨테이너의 권한 상승과 Linux capability를 차단합니다.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      # ConfigMap의 server.py를 컨테이너의 /app에 읽기 전용으로 마운트합니다.
      - name: app
        configMap:
          name: istio-session-test
---
# HTTPRoute와 DestinationRule이 함께 참조하는 공통 백엔드입니다.
apiVersion: v1
kind: Service
metadata:
  name: istio-session-test
spec:
  # 두 Pod의 공통 app label을 선택해 하나의 백엔드로 노출합니다.
  selector:
    app: istio-session-test
  ports:
  - name: http
    # Service 80 포트를 컨테이너의 이름 있는 http 포트(8080)로 전달합니다.
    port: 80
    targetPort: http
